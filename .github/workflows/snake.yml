name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0B66D6&color_dots=#EAEBEE,#D2E3F9,#9BC1F1,#4D8FE6,#0B66D6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#59AAF8&color_dots=#161B22,#0A2D55,#165DB0,#3B82D6,#59AAF8
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
