<style>
.m{font-family:'Geist Mono','JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.s{font-family:'Geist','Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
@keyframes type{to{transform:scaleX(0)}}
.cover{transform-box:fill-box;transform-origin:right center}
.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.f{stroke-dasharray:6 120;animation:flow 3.2s linear infinite}@keyframes flow{from{stroke-dashoffset:126}to{stroke-dashoffset:0}}
.h{transform-box:fill-box;transform-origin:center;animation:halo 2.4s cubic-bezier(0.22,1,0.36,1) infinite}@keyframes halo{0%{transform:scale(1);opacity:.9}70%,100%{transform:scale(3);opacity:0}}
.gl{animation:drift 14s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(-50px,18px)}}
.rise{animation:rise .9s cubic-bezier(0.22,1,0.36,1) .1s both}@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}.rise{opacity:1}}
</style>
